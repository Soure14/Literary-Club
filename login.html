
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101820">

  <title>Área Administrativa | Sociedade Literária</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at top, #293c49 0%, #101820 70%);
      color: #f3eee4;
      font-family: Georgia, "Times New Roman", serif;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      padding: 45px 38px;
      background: linear-gradient(145deg, #1d2b35, #141d25);
      border: 1px solid #756344;
      box-shadow: 0 20px 65px #0005;
    }

    .symbol {
      width: 76px;
      height: 76px;
      margin: 0 auto 25px;
      display: grid;
      place-items: center;
      border: 1px solid #c6a76a;
      border-radius: 50%;
      color: #d4b477;
      font-size: 36px;
    }

    .eyebrow {
      text-align: center;
      color: #c6a76a;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 10px;
      text-align: center;
      font-size: 32px;
      font-weight: normal;
    }

    .description {
      margin: 0 0 35px;
      color: #b8b3aa;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.7;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #d4b477;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #101820;
      border: 1px solid #53616a;
      color: #f3eee4;
      outline: none;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    input:focus {
      border-color: #d4b477;
      box-shadow: 0 0 0 2px #d4b47720;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 75px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #d4b477;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 11px;
    }

    .login-button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: 1px solid #c6a76a;
      background: #c6a76a;
      color: #101820;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
      transition: .2s;
    }

    .login-button:hover {
      background: #dfc58f;
    }

    .back-link {
      display: block;
      margin-top: 28px;
      color: #b8b3aa;
      text-align: center;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 12px;
    }

    .back-link:hover {
      color: #d4b477;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border: 1px solid #9b5555;
      color: #e6aaaa;
      font-family: Arial, sans-serif;
      font-size: 12px;
      text-align: center;
    }

    footer {
      margin-top: 25px;
      color: #817d76;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 35px 23px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <main class="login-container">

    <section class="login-card">

      <div class="symbol">⚜</div>

      <div class="eyebrow">Acesso restrito</div>

      <h1>Área Administrativa</h1>

      <p class="description">
        Bem-vindo de volta à Sociedade Literária.
        Identifique-se para continuar.
      </p>

      <form id="loginForm">

       <label for="username">E-mail</label>
<input type="email" id="username" name="email" placeholder="Digite seu e-mail"
  autocomplete="username" required>
        <div class="form-group">
          <label for="password">Senha</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              id="togglePassword"
            >
              Mostrar
            </button>
          </div>
        </div>

        <button type="submit" class="login-button">
          ENTRAR
        </button>

        <div class="message" id="loginMessage"></div>

      </form>

      <a href="index.html" class="back-link">
        ← Voltar à página inicial
      </a>

    </section>

    <footer>
      SOCIEDADE LITERÁRIA · ADMINISTRAÇÃO
    </footer>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    const password = document.getElementById("password");
    const toggle = document.getElementById("togglePassword");

    toggle.addEventListener("click", () => {
      const visible = password.type === "text";

      password.type = visible ? "password" : "text";
      toggle.textContent = visible ? "Mostrar" : "Ocultar";
    });

    document.getElementById("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  const message = document.getElementById("loginMessage");
  const email = document.getElementById("username").value.trim();
  const passwordValue = document.getElementById("password").value;

  message.style.display = "block";
  message.style.borderColor = "#756344";
  message.style.color = "#d4b477";
  message.textContent = "Verificando acesso...";

  const { data, error } = await window.supabaseClient.auth.signInWithPassword({
    email: email,
    password: passwordValue
  });

  if (error || !data.user) {
    message.style.borderColor = "#9b5555";
    message.style.color = "#e6aaaa";
    message.textContent = "E-mail ou senha incorretos.";
    return;
  }

  const { data: adminRow, error: adminError } = await window.supabaseClient
    .from("admin_users")
    .select("user_id")
    .eq("user_id", data.user.id)
    .maybeSingle();

  if (adminError || !adminRow) {
    await window.supabaseClient.auth.signOut();
    message.style.borderColor = "#9b5555";
    message.style.color = "#e6aaaa";
    message.textContent = "Esta conta não possui autorização administrativa.";
    return;
  }

  window.location.href = "admin.html";
});
  </script>

</body>
</html>
